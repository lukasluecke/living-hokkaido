<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Don't Fall on the Slope</title>
    <!-- The game translates itself (EN / 日本語 button); no browser
         auto-translate on top of it. -->
    <meta name="google" content="notranslate" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(29 42 68);
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        outline: none;
        /* No double-tap zoom or text selection while playing on a phone. */
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
