name: Check
# Paused (Lukas, 2026-11-26): Actions minutes ran out too fast. Run
# `npm run check` locally before each merge. To turn CI back on, set
#   on: [push, pull_request]
# again. It can still be started by hand from the Actions tab.
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
